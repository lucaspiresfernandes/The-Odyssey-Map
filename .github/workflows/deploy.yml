name: Deploy
on:
  push:
    branches: [master]

concurrency: deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      # The production build and both servers, with a GM and a player acting on them.
      - run: bun run test:e2e

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          # The checkout on the server is brought up to the commit that was
          # tested here, and then that commit's own deploy/deploy.sh is run.
          # It is told what was in service before, to go back to.
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" "
            set -e
            cd /home/ubuntu/The-Odyssey-Map
            was=\$(git rev-parse HEAD)
            git fetch --quiet origin master
            git merge --quiet --ff-only $GITHUB_SHA
            bash deploy/deploy.sh \"\$was\"
          "
